function compute(){
  const v={HighBP:S.HighBP,HighChol:S.HighChol,BMI:Math.round(bmiOf()*10)/10,Smoker:S.Smoker,Stroke:S.Stroke,
    HeartDiseaseorAttack:S.HeartDiseaseorAttack,PhysActivity:S.PhysActivity,Fruits:S.Fruits,Veggies:S.Veggies,
    HvyAlcoholConsump:S.HvyAlcoholConsump,GenHlth:S.GenHlth,MentHlth:S.MentHlth,PhysHlth:S.PhysHlth,
    DiffWalk:S.DiffWalk,Sex:S.sex,Age:ageCode(S.age)};
  let logit=MODEL.intercept; const c={};
  MODEL.features.forEach((f,i)=>{const z=(v[f]-MODEL.mean[i])/MODEL.scale[i]; c[f]=MODEL.coef[i]*z; logit+=c[f];});
  const p=1/(1+Math.exp(-logit));
  return {v,c,p};

  const en=n=>n<20?english[n]:['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'][Math.floor(n/10)]+(n%10?' '+english[n%10]:'');
  const fr=n=>n<17?french[n]:n<20?'dix '+french[n-10]:n<70?['','','vingt','trente','quarante','cinquante','soixante'][Math.floor(n/10)]+(n%10===1?' et un':n%10?' '+french[n%10]:''):n<80?'soixante '+(n===71?'et ':'')+fr(n-60):'quatre vingt'+(n===80?'s':' '+fr(n-80));
  const mfe=n=>n<20?kreol[n]:['','','vin','trant','karant','sinkant','swasant','swasanndis','katrovin','katrovin dis'][Math.floor(n/10)]+(n%10?' '+kreol[n%10]:'');
  const names=[];
  for(let n=0;n<=250;n++){
    const tail=n%100, hundreds=Math.floor(n/100);
    let name;
    if(lang==='en')name=hundreds?(hundreds===1?'one':'two')+' hundred'+(tail?' '+en(tail):''):en(n);
    else if(lang==='fr')name=hundreds?(hundreds===1?'cent':'deux cent')+(tail?' '+fr(tail):hundreds===2?'s':''):fr(n);
    else name=hundreds?(hundreds===1?'san':'de san')+(tail?' '+mfe(tail):''):mfe(n);
    names.push([name,n]);
    if(lang==='en'&&hundreds&&tail)names.push([(hundreds===1?'one':'two')+' hundred and '+en(tail),n]);
  }
  let value=text.replace(/(?<=[a-z])-(?=[a-z])/g,' ');
  for(const [name,n] of names.sort((a,b)=>b[0].length-a[0].length))value=value.replace(new RegExp('\\b'+name+'\\b','g'),String(n));
  return value;
}
function confirmVoice(){
  const section=document.querySelector('.journey-question:not([hidden])');
  const text=normal($('voice-transcript').value);
  const radios=[...section.querySelectorAll('[role=radio]')];
  if(radios.length){
    const button=radios.find(button=>normal(button.textContent)===text);
    if(!button){$('voice-status').textContent=VOICE[lang].error;return;}
    button.click();
  }else{
    // Conservative parsing: never guess units, free text, or out-of-range values.
    const numericText=spokenNumbers(text);
    const numbers=numericText.match(/\d+(?:[,.]\d+)?/g)||[];
    const inputs=[...section.querySelectorAll('input')];
    const stripped=numericText.replace(/\d+(?:[,.]\d+)?/g,'').replace(/\b(cm|kg|years|ans|an|centimetres|centimeters|kilograms|kilo|santimet)\b/g,'').replace(/[,;\s]/g,'');
    if(numbers.length!==inputs.length||stripped||inputs.some((input,index)=>{const value=Number(numbers[index].replace(',','.'));return value<Number(input.min)||value>Number(input.max)||(value-Number(input.min))%Number(input.step||1)!==0;})){$('voice-status').textContent=VOICE[lang].error;return;}

}

<script>
/* Public release metadata only. Never reload a screening/report in progress. */
const APP_VERSION='9e622d968b511610';
if(location.protocol!=='file:'&&'serviceWorker' in navigator&&window.isSecureContext){
  let registration,checking=false,reloading=false,pending=false,knownVersion;
  let hadController=!!navigator.serviceWorker.controller;
  const status=document.getElementById('update-status');
  const labels={
    en:{check:'Check for updates',checking:'Checking for updates…',ready:'Update ready. It will apply when you start a new screening.',latest:'This app is up to date.',offline:'Cannot check for updates. Your cached app remains available.',download:'Downloading the latest app…'},
    fr:{check:'Vérifier les mises à jour',checking:'Recherche de mises à jour…',ready:'Mise à jour prête. Elle sera appliquée au prochain dépistage.',latest:'Cette application est à jour.',offline:'Vérification impossible. La version hors ligne reste disponible.',download:'Téléchargement de la nouvelle version…'},

  };
  const t=()=>labels[lang]||labels.en;
  const busy=()=>voiceStarted||complete||startStage==='farewell';
  function applyUpdate(){
    document.getElementById('check-updates').textContent=t().check;
    if(!pending||reloading)return;
    if(busy()){status.textContent=t().ready;return;}
    reloading=true;location.reload();
  }
  async function checkUpdate(manual=false){
    if(checking||reloading||(!manual&&document.visibilityState==='hidden'))return;
    checking=true;if(manual)status.textContent=t().checking;
    try{
      registration=registration||await navigator.serviceWorker.getRegistration();
      if(!registration)throw new Error('Offline installation not ready');

      const response=await fetch('./version.json',{cache:'no-store',signal:AbortSignal.timeout(8000)});
      if(!response.ok)throw new Error('Release metadata unavailable');
      const release=await response.json();
      if(typeof release.version!=='string')throw new Error('Invalid release metadata');
      knownVersion=release.version;
      if(release.version!==APP_VERSION)status.textContent=t().download;
      await registration.update();
      if(release.version===APP_VERSION&&!pending&&manual)status.textContent=t().latest;

  }

  });

  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(result=>{
    registration=result;checkUpdate();
  }).catch(()=>{status.textContent=t().offline;});

}else{
  document.getElementById('check-updates').hidden=true;
}
